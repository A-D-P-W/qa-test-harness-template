# Every push runs the full release test run + the Apps Script type check.
# In a project made from this template, the 'main' ruleset requires check "runall" (docs/RULESETS.md). This template
# repository's own 'main' ruleset blocks force-pushes and deletion only, with no required check.
# No secrets: clasp credentials never reach CI. Full history + tags (fetch-depth 0): module GUARD (a) compares
# each module with the last release/v* tag.
name: tests
on:
  push:              # every branch; no pull_request trigger (it would run the same commit twice)
permissions:
  contents: read
jobs:
  runall:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 2026-11-08: v7.0.1, the latest release (same pin as planner-e2e-showcase); v7's breaking changes affect only
      # pull_request_target and workflow_run, which this workflow does not use.
      # 3.10.0 (template GitHub review M2): v6.0.2 runs on node24 (action.yml `using: node24`); v4.2.2 was node20, which
      # GitHub removed from runners (changelog 2026-09-23). Inputs used here (persist-credentials, fetch-depth) are unchanged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: FULL test run (PowerShell 7 for deploy.ps1 tests; typecheck tools pinned in tests/typecheck/run.sh)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          node --version; pwsh --version
          set -o pipefail
          # The unfilled template is checked in a scratch copy (tools/template_check.sh: on main it fails the review-commit
          # GUARD by design until README § Start a project step 4 is done; the copy fills that in, on this branch, L108).
          # A project made from it runs runall directly.
          if grep -q '"SET_TO_THE_FIRST_COMMIT_AFTER_CREATING_THE_PROJECT"' tests/workflow_review.json; then
            PWSH=pwsh FULL=1 bash tools/template_check.sh 2>&1 | tee runall-output.txt
          else
            PWSH=pwsh FULL=1 ./runall.sh 2>&1 | tee runall-output.txt
          fi
      # L101: each GUARD must fire on a planted violation (scratch copies; the deploy suite is not run there)
      - name: GUARD self-test
        run: |
          set -o pipefail
          bash tools/guard_selftest.sh 2>&1 | tee guard-selftest-output.txt
      # Every problem line becomes a check-run annotation, readable through the checks
      # API without log access (the agent session cannot download job logs).
      - name: Report problems as annotations
        if: failure()
        run: |
          grep -aE '^(UNEXPECTED|GUARD|VERDICT)|^(STALE|BAD) ENTRY|CRASHED' runall-output.txt | head -40 | while IFS= read -r l; do echo "::error title=runall::${l//%/%25}"; done || true
          grep -a '^FAIL' guard-selftest-output.txt 2>/dev/null | head -40 | while IFS= read -r l; do echo "::error title=guard self-test::${l//%/%25}"; done || true
      # 3.10.0 (template review M2): NOTICE lines (template drift, review due, (dev) date) become check-run warnings on every
      # run, so they are readable through the checks API — they never fail the run.
      - name: Report notices as warnings
        if: always()
        run: |
          grep -a '^NOTICE' runall-output.txt | head -40 | while IFS= read -r l; do echo "::warning title=runall::${l//%/%25}"; done || true

  # L103: deploy.ps1 runs on the owner's Windows PC, so its 79 tests also run on Windows (Git Bash + PowerShell 7 +
  # a .cmd fake clasp). windows-2025 is Windows Server 2025, a fresh VM per job; it is not Windows 11 Home.
  # M116 (seeded from MailToDrive L116): an owner who deploys with `powershell` runs Windows PowerShell 5.1, so both shells run.
  deploy-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ps: [pwsh, powershell]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (same as runall)
        with:
          persist-credentials: false
      - name: deploy.ps1 tests on Windows
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global core.autocrlf false
          uname -s; node --version; ${{ matrix.ps }} -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          set -o pipefail
          PWSH=${{ matrix.ps }} bash tests/deploy.test.sh 2>&1 | tee deploy-windows-output.txt
      - name: Report problems as annotations
        if: failure()
        run: |
          grep -a '^FAIL' deploy-windows-output.txt | head -40 | while IFS= read -r l; do echo "::error title=deploy (Windows, ${{ matrix.ps }})::${l//%/%25}"; done || true

  # L104: every tracked shell script passes shellcheck at its default severity. An unquoted path in runall.sh (`rm -rf $O`)
  # deleted a folder next to the repo when the repo path had a space, and that finding (SC2086) is below -S warning.
  # shellcheck is preinstalled on ubuntu-24.04: actions/runner-images images/ubuntu/Ubuntu2404-Readme.md, "Installed apt
  # packages": "| shellcheck | 0.9.0-1 |". The version is printed so a runner-image update shows in the log.
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit (same as runall)
        with:
          persist-credentials: false
      - name: shellcheck every tracked *.sh
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck
